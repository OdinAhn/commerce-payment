spring:
  datasource:
    # GitHub Secrets(환경변수)에서 값을 주입받습니다.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false # 운영 환경에서는 성능을 위해 쿼리 로그를 끕니다.

# PortOne 결제 연동 정보 (GitHub Secrets에서 주입)
portone:
  api:
    key: ${PORTONE_API_KEY}
    secret: ${PORTONE_API_SECRET}
